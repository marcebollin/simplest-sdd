name: Publish GitHub package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish (for example v0.16.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Set up Node and GitHub Packages authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@marcebollin'
          package-manager-cache: false

      - name: Validate the release version
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'simplest-sdd');
          assert.match(process.env.RELEASE_TAG, /^v\d+\.\d+\.\d+$/);
          assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          NODE

      # The CLI tests use Node built-ins; website dependencies are not needed.
      - name: Test the CLI
        run: npm test

      # Only this disposable checkout receives the GitHub scope. npmjs keeps
      # the canonical, unscoped simplest-sdd package name.
      - name: Pack and verify the GitHub copy
        run: |
          npm pkg set name='@marcebollin/simplest-sdd' publishConfig.registry='https://npm.pkg.github.com'
          mkdir -p "$RUNNER_TEMP/github-package" "$RUNNER_TEMP/package-smoke"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/github-package"
          tar -xzf "$RUNNER_TEMP"/github-package/*.tgz -C "$RUNNER_TEMP/package-smoke"
          test "$(node "$RUNNER_TEMP/package-smoke/package/bin/simplest-sdd.mjs" --version)" = "${RELEASE_TAG#v}"
          for command in init update remove; do
            node "$RUNNER_TEMP/package-smoke/package/bin/simplest-sdd.mjs" "$command" --cwd "$RUNNER_TEMP/package-smoke" > /dev/null
          done

      - name: Publish to GitHub Packages
        run: npm publish "$RUNNER_TEMP"/github-package/*.tgz --ignore-scripts --registry=https://npm.pkg.github.com --tag=latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the published version
        run: |
          test "$(npm view '@marcebollin/simplest-sdd@'"${RELEASE_TAG#v}" version --registry=https://npm.pkg.github.com)" = "${RELEASE_TAG#v}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
